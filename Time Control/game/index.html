  </div>

</div>

<!-- YaGames STUB -->

      requestReview:function(){ return Promise.resolve({feedbackSent:false}); }

      canShowPrompt:function(){ return Promise.resolve({canShow:false}); },
      showPrompt:function(){ return Promise.resolve({outcome:'rejected'}); }
    },

    getPlayer:function(){ return Promise.resolve({
      isAuthorized:function(){return false;}, getMode:function(){return 'lite';},

      getPhoto:function(){return '';}, getPayingStatus:function(){return 'unknown';},
      setData:function(){return Promise.resolve();}, getData:function(){return Promise.resolve({});}
    });},

    on:function(){},
    features:{

  return Promise.resolve(sdk);

<!-- sdk.js stub yükle -->
<script>

(function(){
  function u(){
    if(window._au) return; window._au=true;
    try{var c=new(window.AudioContext||window.webkitAudioContext)();
      var b=c.createBuffer(1,1,22050);var s=c.createBufferSource();
      s.buffer=b;s.connect(c.destination);s.start(0);c.resume&&c.resume();
    }catch(e){}
    ['touchstart','pointerdown','click'].forEach(function(t){document.removeEventListener(t,u);});
  }
  ['touchstart','pointerdown','click'].forEach(function(t){document.addEventListener(t,u,{passive:true});});
})();
</script>

<script>
/* ================================================================
   CDN — değiştir
   ================================================================ */
var CDN = "./Build";

var DATA_FILE = "TCT_0_3_2_CG3.data.br";
var WASM_FILE = "TCT_0_3_2_CG3.wasm.br";

var DATA_PARTS = 3;
var WASM_PARTS = 3;

var sources           = {};
var sourcesPlayOneShot= {};
var sdk;
var MyGameInstance    = null;
var _dataBlobUrl      = null;
var _wasmBlobUrl      = null;
var _partsReady       = false;

var loadingBar    = document.querySelector("#unity-loading-bar");
var progressFull  = document.querySelector("#unity-progress-bar-full");
var dlStatus      = document.querySelector("#dl-status");

loadingBar.style.display = "block";

/* DATA 0-50%, WASM 50-90%, Unity 90-100% */
function setBar(pct, label) {
  progressFull.style.width = pct.toFixed(1) + '%';
  if (dlStatus) dlStatus.textContent = label || '';
}

// Global startup flags
window._adClosed = false;
window._partsReady = false;
window._unityStarted = false;
  

async function fetchParts(baseUrl, partCount, barStart, barEnd, label) {
  var parts = [];
  var total = 0;

  for (var i = 1; i <= partCount; i++) {
    var partName = ".part" + String(i).padStart(3, "0");

    console.log("[Drift] Downloading:", baseUrl + partName);

    var response = await fetch(baseUrl + partName, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(partName + " HTTP " + response.status);
    }

    var bytes = new Uint8Array(await response.arrayBuffer());

    if (bytes.length === 0) {
      throw new Error(partName + " is empty!");
    }

    parts.push(bytes);
    total += bytes.length;

    console.log(
      "[Drift] " + partName + ": " +
      bytes.length + " bytes"
    );

    setBar(
      barStart + (i / partCount) * (barEnd - barStart),
      label + i + "/" + partCount
    );
  }

  var merged = new Uint8Array(total);
  var offset = 0;

  for (var j = 0; j < parts.length; j++) {
    merged.set(parts[j], offset);
    offset += parts[j].length;
  }

  console.log("[Drift] Merge complete:", merged.length, "bytes");

  return merged; // IMPORTANT!
}


  


var _brotliPromise = null;

async function getBrotliDecoder() {
  if (!_brotliPromise) {
    _brotliPromise = import(
      "https://unpkg.com/brotli-wasm@3.0.0/index.web.js?module"
    ).then(function(module) {
      return module.default;
    });
  }

  return await _brotliPromise;
}

async function brotliBlobUrl(uint8, mimeType, filename) {
  var brotli = await getBrotliDecoder();

  // Decompress the original Brotli data
  var decompressedBytes = brotli.decompress(uint8);

  // Create a correctly typed Blob
  var blob = new Blob([decompressedBytes], {
    type: mimeType
  });

  return URL.createObjectURL(blob);
}



async function decompressChecked(bytes, mimeType, filename, label) {
  console.log(
    "[Drift] Decompressing " + label + ":",
    bytes ? bytes.length : "UNDEFINED",
    "bytes"
  );

  if (!bytes || !bytes.length) {
    throw new Error(label + " has no downloaded data!");
  }

  console.log(
    "[Drift] " + label + " first bytes:",
    Array.from(bytes.slice(0, 8))
      .map(b => b.toString(16).padStart(2, "0"))
      .join(" ")
  );

  try {
    var result = await brotliBlobUrl(
      bytes,
      mimeType,
      filename
    );

    console.log("[Drift] " + label + " decompressed successfully!");

    return result;

  } catch (error) {
    console.error("[Drift] " + label + " FAILED:", error);

    throw new Error(
      label + " Brotli decompression failed: " + error.message
    );
  }
}


async function preloadParts() {
  try {
    setBar(0, "Downloading DATA...");

    var dataBytes = await fetchParts(
      CDN + "/" + DATA_FILE,
      DATA_PARTS,
      0,
      50,
      "DATA "
    );

    console.log("[Drift] DATA size:", dataBytes.byteLength);

_dataBlobUrl = await decompressChecked(
  dataBytes,
  "application/octet-stream",
  "TCT_0_3_2_CG3.data",
  "DATA"
);

    setBar(50, "Downloading WASM...");

    var wasmBytes = await fetchParts(
      CDN + "/" + WASM_FILE,
      WASM_PARTS,
      50,
      85,
      "WASM "
    );

    console.log("[Drift] WASM size:", wasmBytes.byteLength);

_wasmBlobUrl = await decompressChecked(
  wasmBytes,
  "application/wasm",
  "TCT_0_3_2_CG3.wasm",
  "WASM"
);

    setBar(85, "Downloading framework...");

    _frameworkBlobUrl = await fetchBrotliFile(
      CDN + "/TCT_0_3_2_CG3.framework.js.br",
      "application/javascript",
      "TCT_0_3_2_CG3.framework.js"
    );

    _partsReady = true;

    console.log("[Drift] All files ready!");

    tryStartUnity();

  } catch (e) {
    console.error("[Drift] Preload error:", e);
    dlStatus.textContent = "Download error: " + e.message;
  }
}


/* SDK init + reklam — reklam kapanınca Unity başlar */
YaGames.init().then(function(ysdk) {
  console.log('Yandex SDK initialized');
  window.ysdk = ysdk;
  sdk = ysdk;

  sdk.adv.showFullscreenAdv({callbacks:{
    onClose:   function(){ closeAdFunction(); },
    onError:   function(){ closeAdFunction(); },
    onOffline: function(){ closeAdFunction(); }
  }});
});

/* Paralel: SDK init + reklam + part indirme aynı anda */
preloadParts();


function tryStartUnity() {
  if (_adClosed && _partsReady && !_unityStarted) {
    _unityStarted = true;

    console.log("[Drift] Starting Unity...");

    initializeUnity();
  }
}

function closeAdFunction() {
  if (_adClosed) return;

  console.log("[Drift] Ad closed");

  _adClosed = true;

  tryStartUnity();
}

function initializeUnity() {
  var container     = document.querySelector("#unity-container");
  var canvas        = document.querySelector("#unity-canvas");
  var warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    function upd(){ warningBanner.style.display = warningBanner.children.length?'block':'none'; }
    var div=document.createElement('div'); div.innerHTML=msg; warningBanner.appendChild(div);
    if(type==='error') div.style='background:red;padding:10px;';
    else { if(type==='warning') div.style='background:yellow;padding:10px;';
      setTimeout(function(){ warningBanner.removeChild(div); upd(); },5000); }
    upd();
  }

var config = {
  dataUrl: _dataBlobUrl,
  frameworkUrl: _frameworkBlobUrl,
  codeUrl: _wasmBlobUrl,
  streamingAssetsUrl: "StreamingAssets",

  companyName: "Drift No Limit",
  productName: "Drift No Limit",
  productVersion: "90",

  showBanner: unityShowBanner
};

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta=document.createElement('meta');
    meta.name='viewport';
    meta.content='width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
    container.className="unity-mobile";
  }
  canvas.style.width="100%"; canvas.style.height="100%";

  var script=document.createElement("script");
  script.src=CDN+"/TCT_0_3_2_CG3.loader.js";
  script.onload=function(){
    createUnityInstance(canvas, config, function(progress){
      setBar(90+progress*10, progress<1?'Oyun yükleniyor... '+Math.round(90+progress*10)+'%':'');
    }).then(function(inst){
      MyGameInstance = inst;
      loadingBar.style.display = "none";
    }).catch(function(msg){ alert(msg); });
  };
  document.body.appendChild(script);
}
</script>
</body>
</html>
