<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Time Control</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">

  <style>
    #part-loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
    }

    #part-loader h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }

    .part-item {
      width: 400px;
      max-width: calc(100vw - 32px);
      margin: 6px 0;
      font-size: 1em;
    }

    .part-label { margin-bottom: 3px; }

    .part-bar-bg {
      width: 100%;
      height: 18px;
      background: #ddd;
      border: 2px solid black;
    }

    .part-bar-fill {
      height: 100%;
      background: #f5c518;
      width: 0%;
      transition: width 0.1s;
    }

    .part-status {
      font-size: 0.85em;
      color: #555;
    }

    #overall-status {
      margin-top: 20px;
      font-size: 1.1em;
    }
  </style>
</head>

<body>
  <div id="part-loader">
    <h1>Loading...</h1>
    <div id="parts-list"></div>
    <div id="overall-status">changing clocks...</div>
  </div>

  <div id="unity-container" style="display: none">
    <canvas id="unity-canvas" width="480" height="360" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    // FILES TO DOWNLOAD
    const PART_FILES = [
      {
        base: "./Build/TCT_0_3_2_CG3.data.br",
        label: "CheeseRolling.data"
      },
      {
        base: "./Build/TCT_0_3_2_CG3.wasm.br",
        label: "CheeseRolling.wasm"
      }
    ];

    const assembledBlobs = {};

    const partsList = document.getElementById("parts-list");
    const overallStatus = document.getElementById("overall-status");

    function makePartRow(id, label) {
      const wrap = document.createElement("div");
      wrap.className = "part-item";
      wrap.innerHTML = `
        <div class="part-label" id="lbl-${id}">${label}</div>
        <div class="part-bar-bg">
          <div class="part-bar-fill" id="bar-${id}"></div>
        </div>
        <div class="part-status" id="status-${id}">waiting...</div>
      `;
      partsList.appendChild(wrap);
    }

    function setBar(id, pct) {
      document.getElementById("bar-" + id).style.width = pct + "%";
    }

    function setStatus(id, text) {
      document.getElementById("status-" + id).textContent = text;
    }

    // Each of the DATA and WASM files has three parts.
    async function countParts(base) {
      return 3;
    }

    async function fetchPart(url, onProgress) {
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status} for ${url}`);
      }

      const total = parseInt(res.headers.get("Content-Length") || "0", 10);
      if (!res.body) {
        throw new Error("Response has no readable body: " + url);
      }

      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        chunks.push(value);
        received += value.length;
        if (total) onProgress(received / total);
      }

      return new Blob(chunks);
    }

    // DOWNLOAD AND JOIN ALL PARTS OF ONE FILE IN ORDER.
    async function loadFile(fileInfo, rowIdPrefix) {
      const { base, label } = fileInfo;
      const numParts = await countParts(base);
      const rowIds = [];

      for (let i = 1; i <= numParts; i++) {
        const rowId = `${rowIdPrefix}_${i}`;
        rowIds.push(rowId);
        makePartRow(rowId, `${label} — part ${i} of ${numParts}`);
      }

      const blobs = [];

      for (let i = 1; i <= numParts; i++) {
        const rowId = rowIds[i - 1];
        const url = `${base}.part${String(i).padStart(3, "0")}`;

        setStatus(rowId, "downloading...");

        const blob = await fetchPart(url, (p) => {
          const percent = Math.round(p * 100);
          setBar(rowId, percent);
          setStatus(rowId, percent + "%");
        });

        setBar(rowId, 100);
        setStatus(rowId, "ready and done");
        blobs.push(blob);
      }

      const mimeType = base.includes(".wasm")
        ? "application/wasm"
        : "application/octet-stream";

      return new Blob(blobs, { type: mimeType });
    }

    // FETCH THE FRAMEWORK AND GIVE UNITY A BLOB URL.
    async function loadFramework() {
      overallStatus.textContent = "LOADING FRAMEWORK...";

      const response = await fetch("./Build/TCT_0_3_2_CG3.framework.js.br");
      if (!response.ok) {
        throw new Error("Framework failed to load: HTTP " + response.status);
      }

      const frameworkBlob = await response.blob();
      return URL.createObjectURL(
        new Blob([frameworkBlob], { type: "application/javascript" })
      );
    }

    async function loadAllParts() {
      try {
        for (let i = 0; i < PART_FILES.length; i++) {
          overallStatus.textContent = `LOADING ${PART_FILES[i].label}...`;

          const blob = await loadFile(PART_FILES[i], "file" + i);
          assembledBlobs[PART_FILES[i].base] = URL.createObjectURL(blob);
        }

        overallStatus.textContent = "Preparing Unity...";
        await startUnity();
      } catch (e) {
        overallStatus.textContent = "it broke!111! " + e.message;
        console.error("LOADING ERROR:", e);
      }
    }

    async function startUnity() {
      const buildUrl = "./Build";
      const loaderUrl = buildUrl + "/TCT_0_3_2_CG3.loader.js";

      // Load the framework before creating the Unity instance.
      const frameworkBlobUrl = await loadFramework();

      document.getElementById("part-loader").style.display = "none";
      document.getElementById("unity-container").style.display = "";

// Service worker registration removed: this game does not require ServiceWorker.js.\n
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        const div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type === "warning") {
            div.style = "background: yellow; padding: 10px;";
          }
          setTimeout(function () {
            if (warningBanner.contains(div)) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      const config = {
        dataUrl: assembledBlobs["./Build/TCT_0_3_2_CG3.data.br"],
        frameworkUrl: frameworkBlobUrl,
        codeUrl: assembledBlobs["./Build/TCT_0_3_2_CG3.wasm.br"],
        streamingAssetsUrl: "StreamingAssets",
        companyName: "YCP",
        productName: "Time Control",
        productVersion: "v1.5.1",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.head.appendChild(meta);
      }

      loadingBar.style.display = "block";

      // Create the loader script.
      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        console.log("UNITY LOADER SCRIPT LOADED");

        let unityProgress = 0;
        let unityFinished = false;

        const stuckTimer = setTimeout(() => {
          if (!unityFinished) {
            console.error("UNITY STUCK AT:", Math.round(unityProgress * 100) + "%");
          }
        }, 30000);

        console.log("UNITY CONFIG:", config);

        createUnityInstance(
          canvas,
          config,
          (progress) => {
            unityProgress = progress;
            const percent = Math.round(progress * 100);
            console.log("UNITY LOADING:", percent + "%");
            progressBarFull.style.width = percent + "%";
          }
        )
          .then((unityInstance) => {
            unityFinished = true;
            clearTimeout(stuckTimer);
            loadingBar.style.display = "none";
            console.log("UNITY LOADED SUCCESSFULLY!", unityInstance);
          })
          .catch((error) => {
            unityFinished = true;
            clearTimeout(stuckTimer);
            console.error("UNITY INITIALIZATION FAILED:", error);
            alert("Unity initialization failed: " + (error && error.message ? error.message : error));
          });
      };

      script.onerror = () => {
        console.error("FAILED TO LOAD UNITY LOADER:", script.src);
        overallStatus.textContent = "Unity loader failed to load.";
      };

      // IMPORTANT: Append the script OUTSIDE its onload callback.
      // This starts loading loader.js and allows script.onload to fire.
      document.body.appendChild(script);
    }

    // BEGIN
    loadAllParts();
  </script>
</body>
</html>
