<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<title>Unity WebGL Player | Drift No Limit</title>
<link rel="shortcut icon" href="favicon.ico"/>
<link rel="stylesheet" href="style.css"/>
<!-- howler.js — CDN'den (Web Audio library, oyunun ihtiyacı) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>
<div id="unity-container" style="position:absolute;width:100%;height:100%;left:0;top:0;">
  <canvas id="unity-canvas" style="position:absolute;width:100%;height:100%;"></canvas>
  <div id="unity-loading-bar">
    <div id="unity-logo"></div>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full" style="width:0%;"></div>
    </div>
    <div id="dl-status" style="text-align:center;font-size:12px;color:rgba(255,255,255,.7);
         font-family:sans-serif;margin-top:6px;letter-spacing:.4px;">Hazırlanıyor...</div>
  </div>
  <div id="unity-warning"></div>
</div>

<!-- YaGames STUB -->
<script>
window.YaGames = { init: function() {
  var sdk = {
    environment:{ app:{id:'0'}, i18n:{lang:'en',tld:'com'}, browser:{lang:'en'}, payload:null },
    deviceInfo:{ type:'desktop',
      isMobile:function(){return false;}, isDesktop:function(){return true;},
      isTablet:function(){return false;}, isTV:function(){return false;}
    },
    adv:{
      showFullscreenAdv:function(o){
        if(o&&o.callbacks&&o.callbacks.onClose) o.callbacks.onClose(false);
      },
      showRewardedVideo:function(o){
        if(!o||!o.callbacks) return;
        if(o.callbacks.onOpen)     o.callbacks.onOpen();
        if(o.callbacks.onRewarded) o.callbacks.onRewarded();
        if(o.callbacks.onClose)    o.callbacks.onClose();
      },
      showBannerAdv:function(){}, hideBannerAdv:function(){},
      getBannerAdvStatus:function(){ return Promise.resolve({stickyAdvIsShowing:false}); }
    },
    auth:{ openAuthDialog:function(){ return Promise.resolve(); } },
    feedback:{
      canReview:function(){ return Promise.resolve({value:false,reason:''}); },
      requestReview:function(){ return Promise.resolve({feedbackSent:false}); }
    },
    shortcut:{
      canShowPrompt:function(){ return Promise.resolve({canShow:false}); },
      showPrompt:function(){ return Promise.resolve({outcome:'rejected'}); }
    },
    getPayments:function(){ return Promise.reject('no payments'); },
    getPlayer:function(){ return Promise.resolve({
      isAuthorized:function(){return false;}, getMode:function(){return 'lite';},
      getName:function(){return '';}, getUniqueID:function(){return '0';},
      getPhoto:function(){return '';}, getPayingStatus:function(){return 'unknown';},
      setData:function(){return Promise.resolve();}, getData:function(){return Promise.resolve({});}
    });},
    serverTime:function(){ return Promise.resolve(Date.now()); },
    on:function(){},
    features:{
      LoadingAPI:{ready:function(){}},
      GameplayAPI:{start:function(){},stop:function(){}}
    }
  };
  return Promise.resolve(sdk);
}};
</script>

<!-- sdk.js stub yükle -->
<script>

(function(){
  function u(){
    if(window._au) return; window._au=true;
    try{var c=new(window.AudioContext||window.webkitAudioContext)();
      var b=c.createBuffer(1,1,22050);var s=c.createBufferSource();
      s.buffer=b;s.connect(c.destination);s.start(0);c.resume&&c.resume();
    }catch(e){}
    ['touchstart','pointerdown','click'].forEach(function(t){document.removeEventListener(t,u);});
  }
  ['touchstart','pointerdown','click'].forEach(function(t){document.addEventListener(t,u,{passive:true});});
})();
</script>

<script>

/* ================================================================
   DRIFT NO LIMIT - UNITY LOADER
   ================================================================ */

var CDN = "./Build";

var DATA_FILE = "TCT_0_3_2_CG3.data.br";
var WASM_FILE = "TCT_0_3_2_CG3.wasm.br";

var DATA_PARTS = 3;
var WASM_PARTS = 3;

var sources = {};
var sourcesPlayOneShot = {};
var sdk = null;
var MyGameInstance = null;

var _dataBlobUrl = null;
var _wasmBlobUrl = null;
var _frameworkBlobUrl = null;

// Startup flags
window._adClosed = false;
window._partsReady = false;
window._unityStarted = false;

// Loading elements
var loadingBar = document.querySelector("#unity-loading-bar");
var progressFull = document.querySelector("#unity-progress-bar-full");
var dlStatus = document.querySelector("#dl-status");

loadingBar.style.display = "block";


/* ================================================================
   LOADING BAR
   ================================================================ */

function setBar(pct, label) {
  progressFull.style.width = pct.toFixed(1) + "%";

  if (dlStatus) {
    dlStatus.textContent = label || "";
  }
}


/* ================================================================
   DOWNLOAD AND MERGE PARTS
   ================================================================ */

async function fetchParts(baseUrl, partCount, barStart, barEnd, label) {
  var parts = [];
  var total = 0;

  for (var i = 1; i <= partCount; i++) {
    var partName = ".part" + String(i).padStart(3, "0");
    var url = baseUrl + partName;

    console.log("[Drift] Downloading:", url);

    var response = await fetch(url, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(partName + " HTTP " + response.status);
    }

    console.log("[Drift] Encoding:", response.headers.get("content-encoding"));

    var bytes = new Uint8Array(
      await response.arrayBuffer()
    );

    if (bytes.length === 0) {
      throw new Error(partName + " is empty!");
    }

    console.log(
      "[Drift] " + partName + ": " + bytes.length + " bytes"
    );

    parts.push(bytes);
    total += bytes.length;

    setBar(
      barStart + (i / partCount) * (barEnd - barStart),
      label + i + "/" + partCount
    );
  }

  var merged = new Uint8Array(total);
  var offset = 0;

  for (var j = 0; j < parts.length; j++) {
    merged.set(parts[j], offset);
    offset += parts[j].length;
  }

  console.log("[Drift] Merge complete:", merged.length, "bytes");

  return merged;
}


/* ================================================================
   DOWNLOAD FRAMEWORK
   ================================================================ */

async function fetchFrameworkFile(url) {
  console.log("[Drift] Downloading framework...");

  var response = await fetch(url, {
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error("Framework HTTP " + response.status);
  }

  var bytes = await response.arrayBuffer();

  var preview = new TextDecoder().decode(
    new Uint8Array(bytes.slice(0, 30))
  );

  console.log("[Drift] Framework preview:", preview);

  if (!preview.startsWith("function unityFramework")) {
    throw new Error("Framework is not valid JavaScript!");
  }

  var blob = new Blob([bytes], {
    type: "application/javascript"
  });

console.log("[Drift] FRAMEWORK ready!");

return URL.createObjectURL(blob);
}


/* ================================================================
   PRELOAD ALL UNITY FILES
   ================================================================ */

async function preloadParts() {
  try {

    // DOWNLOAD DATA
    setBar(0, "Downloading DATA...");

    var dataBytes = await fetchParts(
      CDN + "/" + DATA_FILE,
      DATA_PARTS,
      0,
      50,
      "DATA "
    );

    console.log("[Drift] DATA size:", dataBytes.byteLength);

    var dataHeader = new TextDecoder().decode(
      dataBytes.slice(0, 15)
    );

    if (dataHeader !== "UnityWebData1.0") {
      throw new Error("Invalid DATA file signature: " + dataHeader);
    }

    _dataBlobUrl = URL.createObjectURL(
      new Blob([dataBytes], {
        type: "application/octet-stream"
      })
    );

    console.log("[Drift] DATA ready!");


    // DOWNLOAD WASM
    setBar(50, "Downloading WASM...");

    var wasmBytes = await fetchParts(
      CDN + "/" + WASM_FILE,
      WASM_PARTS,
      50,
      85,
      "WASM "
    );

    console.log("[Drift] WASM size:", wasmBytes.byteLength);

    if (
      wasmBytes[0] !== 0 ||
      wasmBytes[1] !== 97 ||
      wasmBytes[2] !== 115 ||
      wasmBytes[3] !== 109
    ) {
      throw new Error("Invalid WASM file signature!");
    }

    _wasmBlobUrl = URL.createObjectURL(
      new Blob([wasmBytes], {
        type: "application/wasm"
      })
    );

    console.log("[Drift] WASM ready!");


    // DOWNLOAD FRAMEWORK
    setBar(85, "Downloading framework...");

_frameworkBlobUrl = await fetchFrameworkFile(
  CDN + "/TCT_0_3_2_CG3.framework.js.br"
);

    // EVERYTHING READY
    window._partsReady = true;

    console.log("[Drift] All files ready!");

    setBar(90, "Waiting to start game...");

    tryStartUnity();

  } catch (e) {
    console.error("[Drift] Preload error:", e);

    dlStatus.textContent = "Download error: " + e.message;
  }
}


/* ================================================================
   STARTUP CONTROL
   ================================================================ */

function tryStartUnity() {
  if (
    window._adClosed &&
    window._partsReady &&
    !window._unityStarted
  ) {
    window._unityStarted = true;

    console.log("[Drift] Starting Unity...");

    initializeUnity();
  }
}

function closeAdFunction() {
  if (window._adClosed) return;

  console.log("[Drift] Ad closed");

  window._adClosed = true;

  tryStartUnity();
}


/* ================================================================
   UNITY INITIALIZATION
   ================================================================ */


function initializeUnity() {
  var container = document.querySelector("#unity-container");
  var canvas = document.querySelector("#unity-canvas");
  var warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    function updateBanner() {
      warningBanner.style.display =
        warningBanner.children.length ? "block" : "none";
    }

    var div = document.createElement("div");
    div.innerHTML = msg;
    warningBanner.appendChild(div);

    if (type === "error") {
      div.style = "background:red;padding:10px;";
    } else {
      if (type === "warning") {
        div.style = "background:yellow;padding:10px;";
      }

      setTimeout(function() {
        if (div.parentNode === warningBanner) {
          warningBanner.removeChild(div);
          updateBanner();
        }
      }, 5000);
    }

    updateBanner();
  }

  var config = {
    dataUrl: _dataBlobUrl,
    frameworkUrl: _frameworkBlobUrl,
    codeUrl: _wasmBlobUrl,
    streamingAssetsUrl: "StreamingAssets",

    companyName: "Drift No Limit",
    productName: "Drift No Limit",
    productVersion: "90",

    showBanner: unityShowBanner
  };

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement("meta");
    meta.name = "viewport";
    meta.content =
      "width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes";

    document.head.appendChild(meta);
    container.className = "unity-mobile";
  }

  canvas.style.width = "100%";
  canvas.style.height = "100%";

  // Load Unity loader
  var script = document.createElement("script");
  script.src = CDN + "/TCT_0_3_2_CG3.loader.js";

  script.onload = function() {
    console.log("[Drift] Unity loader downloaded!");

    try {
      if (typeof createUnityInstance !== "function") {
        throw new Error("createUnityInstance is missing!");
      }

      createUnityInstance(
        canvas,
        config,
        function(progress) {
          console.log(
            "[Drift] Unity loading progress:",
            Math.round(progress * 100) + "%"
          );

          setBar(
            90 + progress * 10,
            progress < 1
              ? "Game loading... " +
                Math.round(90 + progress * 10) + "%"
              : ""
          );
        }
      ).then(function(inst) {
        MyGameInstance = inst;
        loadingBar.style.display = "none";

        console.log("[Drift] GAME STARTED!");

      }).catch(function(error) {
        console.error(
          "[Drift] Unity initialization failed:",
          error
        );

        dlStatus.textContent = "Unity error: " + error;
      });

    } catch (error) {
      console.error("[Drift] Unity loader error:", error);
      dlStatus.textContent = error.message;
    }
  };

  script.onerror = function() {
    console.error("[Drift] Unity loader failed to download!");
    dlStatus.textContent = "Unity loader download failed!";
  };

  document.body.appendChild(script);
}


/* ================================================================
   YANDEX SDK INITIALIZATION
   ================================================================ */

YaGames.init().then(function(ysdk) {
  console.log("[Drift] Yandex SDK initialized");

  window.ysdk = ysdk;
  sdk = ysdk;

  sdk.adv.showFullscreenAdv({
    callbacks: {
      onClose: function() {
        closeAdFunction();
      },

      onError: function() {
        closeAdFunction();
      },

      onOffline: function() {
        closeAdFunction();
      }
    }
  });

}).catch(function(error) {
  console.error("[Drift] SDK initialization failed:", error);

  closeAdFunction();
});


/* ================================================================
   START DOWNLOADING
   ================================================================ */

preloadParts();


</script>
</body>
</html>
